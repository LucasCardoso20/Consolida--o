<!-- public/index.html -->

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paz Church — Consolidação</title>

    <!--
      Carregar a fonte Inter do Google Fonts.
      A ordem é importante: primeiro preconnect, depois o link da fonte.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <!--
    Aplicar as classes de fundo e texto do design system no body.
    Isso garante que todas as páginas herdem as cores padrão.
  -->
  <body class="min-h-screen bg-paz-background text-paz-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
